<div class="container mt-5 mb-5">
  <div class="row">
    <div class="col-8">
      <h1>Products</h1>
    </div>
    <div class="col-4 text-end">
      <button class="btn btn-success" (click)="openModal()">Add Products +</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="row">
    @if(loading){
        <p>loading</p>
    }
    @else if(error){
   <p>error</p>
    }
    @else{
            @for(product of Products; track $index) {
              <div class="col-4">
      <div class="card">
         <button class="btn btn-danger" (click)="onDeleteProduct(product.product_id)">delete Product</button>
        <img class="img-fluid" width="130" [src]="product.image" alt="Card image cap" />
        <div class="card-body">
          <h5 class="card-title">{{product.title}}</h5>
          <div class="d-flex">
            <h6 class="me-2">Price :</h6>
            <h6 class="text-danger">$ {{product.price}}</h6>
          </div>
          <p class="card-text">
        {{product.description}}
          </p>
             <div class="d-flex ">
                <button (click)="onEditProduct(product._id,product)" class="btn btn-warning me-2">Edit</button>
                <button class="btn btn-primary">View</button>
             </div>
        </div>
      </div>
    </div>
       }
    }
    
 
  </div>
</div>


<div class="modal" #newModal  tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h5 class="modal-title">Add Products</h5>
        <button (click)="closeModal()"  type="button" class="close btn" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
<form [formGroup]="products">
   
  <div class="form-group">
    <label for="exampleFormControlInput1">ImageURL</label>
    <input type="text" formControlName="image" class="form-control" id="exampleFormControlInput1" placeholder="image url">
  </div>
   <div class="form-group">
    <label for="exampleFormControlInput1">Product Title</label>
    <input type="text" formControlName="title" class="form-control" id="exampleFormControlInput1" placeholder="eg : Apple iPhone 14">
  </div>
    <div class="form-group">
     <label for="exampleFormControlInput1">Product Price</label>
     <input type="number" formControlName="price" class="form-control" id="exampleFormControlInput1" placeholder="eg : 999">
    </div>
     <div class="form-group">
    <label for="exampleFormControlTextarea1">Product Description</label>
    <textarea formControlName="description" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
  </div>
</form>
      </div>
      <div class="modal-footer">
        <button *ngIf="!editMode" type="button" class="btn btn-primary" (click)="saveProductDetails()">Save Product</button>
        <button *ngIf="editMode"  type="button" class="btn btn-primary" (click)="onUpdateProduct()">update Product</button>
        <button type="button" (click)="closeModal()" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
